version: '3.9'

services:
  trading-bot:
    build: .
    container_name: deriv_trading_bot
    ports:
      - "8008:8008"
    environment:
      - DJANGO_SETTINGS_MODULE=dashboard_settings
      - DERIV_API_TOKEN=${DERIV_API_TOKEN:-}
      - PAPER_MODE=${PAPER_MODE:-true}
    volumes:
      - .:/app
    restart: unless-stopped
